
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ColdRollingAI - 工业智能体交易平台</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM (UMD) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Lucide Icons (UMD) -->
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>
    
    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      
      /* Animation Utilities */
      .animate-in { animation-duration: 0.3s; animation-fill-mode: both; }
      .fade-in { animation-name: fadeIn; }
      .slide-in-right { animation-name: slideInRight; }
      .slide-in-up { animation-name: slideInUp; }
      .zoom-in { animation-name: zoomIn; }

      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideInRight { from { transform: translateX(1rem); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
      @keyframes slideInUp { from { transform: translateY(1rem); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="env,react,typescript">
        const { useState, useEffect, useRef, useMemo } = React;
        
        // Expose Lucide icons
        const { 
            Search, LayoutGrid, Box, LineChart, Zap, Layers, User, Settings, LogOut, PlusCircle, Shield, 
            Database, BookOpen, Cpu, FileText, Calendar, MoreVertical, Bell, Activity, AlertTriangle, 
            Factory, ShieldCheck, MoreHorizontal, Volume2, Send, Sparkles, BarChart2, GitBranch, MessageCircle, 
            X, CheckCircle, Heart, PlayCircle, Radio, Tag, HelpCircle, AlertCircle, Video, Image, 
            GripVertical, Trash2, Plus, Lightbulb, BarChart3, Upload, Info, DollarSign, Wallet, Save, 
            ChevronRight, PenTool, Camera, FileCode, Globe, Building2, Briefcase, Share2, Power, History, 
            UploadCloud, LifeBuoy, DownloadCloud, FileClock, HardHat, Lock, MapPin, Moon, Key, Copy, Eye, 
            EyeOff, Smartphone, Mail, ArrowUpRight, ArrowDownLeft, RefreshCw, TrendingUp, Users, Droplet, 
            Truck, ShieldAlert, Check, Monitor, PieChart, File, ShoppingBag, CreditCard, SwitchCamera, LayoutDashboard,
            Repeat, UserPlus, LogIn
        } = lucideReact;

        const ImageIcon = Image; 

        // --- MOCK DATA ACCOUNTS ---
        const MOCK_ACCOUNTS = [
            {
                id: 'acc_admin',
                name: 'Tech_Master_01',
                role: 'admin', // Full access
                title: '认证高级开发者',
                avatar: 'https://picsum.photos/seed/user_avatar_main/200/200',
                org: '宝信软件 (Baosight)',
                balance: '¥ 12,404.00',
                canSwitchConsole: true
            },
            {
                id: 'acc_viewer',
                name: 'Purchase_User_02',
                role: 'viewer', // Buyer only
                title: '采购经理',
                avatar: 'https://picsum.photos/seed/user_avatar_2/200/200',
                org: '某大型钢企',
                balance: '¥ 50,000.00',
                canSwitchConsole: false
            }
        ];

        // --- COMPONENTS ---

        // 1. Sidebar Component (Enhanced Logic)
        const Sidebar = ({ 
            consoleMode, 
            setConsoleMode, 
            currentView, 
            onChangeView, 
            currentAccount, 
            onSwitchAccount 
        }) => {
            const [showAccountMenu, setShowAccountMenu] = useState(false);

            // Menu Definition
            const buyerMenu = [
                { id: 'discovery', icon: <Search size={18} />, label: '探索市场' },
                { id: 'categories', icon: <LayoutGrid size={18} />, label: '全部分类' },
                { id: 'demand_square', icon: <Briefcase size={18} />, label: '需求广场' },
                { isDivider: true },
                { id: 'buyer_dashboard', icon: <LayoutDashboard size={18} />, label: '工作台 (Dashboard)' },
                { id: 'my_subscriptions', icon: <ShoppingBag size={18} />, label: '我的已购' },
                { id: 'my_favorites', icon: <Heart size={18} />, label: '我的收藏' },
            ];

            const sellerMenu = [
                { id: 'seller_dashboard', icon: <BarChart3 size={18} />, label: '概览 (Overview)' },
                { id: 'my_agents', icon: <Box size={18} />, label: '我的资产' },
                { id: 'income', icon: <Wallet size={18} />, label: '收益管理' },
                { id: 'tickets', icon: <LifeBuoy size={18} />, label: '工单服务' },
            ];

            const currentMenu = consoleMode === 'seller' ? sellerMenu : buyerMenu;

            return (
                <div className="w-64 bg-white border-r border-gray-100 flex flex-col h-full sticky top-0 shadow-[2px_0_24px_rgba(0,0,0,0.02)] z-50">
                    
                    {/* Header / Logo */}
                    <div className="p-6 flex items-center gap-3 cursor-pointer" onClick={() => onChangeView('discovery')}>
                        <div className={`w-8 h-8 rounded-lg flex items-center justify-center text-white shadow-lg transition-colors ${consoleMode === 'seller' ? 'bg-indigo-600 shadow-indigo-200' : 'bg-blue-600 shadow-blue-200'}`}>
                           {consoleMode === 'seller' ? <CodeBoxIcon /> : <LayoutGrid size={20} />}
                        </div>
                        <span className="font-bold text-gray-800 text-lg tracking-tight">
                            {consoleMode === 'seller' ? '维观·开发者' : '维观·市场'}
                        </span>
                    </div>

                    {/* Console Switcher (Only if permitted) */}
                    <div className="px-4 mb-4">
                        {currentAccount.canSwitchConsole ? (
                            <div className="bg-gray-100/50 p-1 rounded-xl flex border border-gray-200">
                                <button 
                                    onClick={() => { setConsoleMode('buyer'); onChangeView('discovery'); }}
                                    className={`flex-1 py-2 text-xs font-bold rounded-lg flex items-center justify-center gap-1.5 transition-all ${consoleMode === 'buyer' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
                                >
                                    <User size={14} /> 用户
                                </button>
                                <button 
                                    onClick={() => { setConsoleMode('seller'); onChangeView('seller_dashboard'); }}
                                    className={`flex-1 py-2 text-xs font-bold rounded-lg flex items-center justify-center gap-1.5 transition-all ${consoleMode === 'seller' ? 'bg-white text-indigo-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
                                >
                                    <Cpu size={14} /> 开发者
                                </button>
                            </div>
                        ) : (
                            <div className="bg-gray-50 p-3 rounded-xl border border-gray-100 flex items-center gap-2 text-gray-400">
                                <Lock size={14} />
                                <span className="text-xs font-medium">开发者模式未激活</span>
                            </div>
                        )}
                    </div>

                    {/* Navigation */}
                    <div className="flex-1 overflow-y-auto px-4 space-y-1 py-2 custom-scrollbar">
                        {currentMenu.map((item, idx) => (
                            item.isDivider ? (
                                <div key={idx} className="h-px bg-gray-100 my-3 mx-2" />
                            ) : (
                                <button
                                    key={item.id}
                                    onClick={() => onChangeView(item.id)}
                                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all group ${
                                        currentView === item.id 
                                            ? (consoleMode === 'seller' ? 'bg-indigo-50 text-indigo-600' : 'bg-blue-50 text-blue-600')
                                            : 'text-gray-500 hover:bg-gray-50 hover:text-gray-900'
                                    }`}
                                >
                                    <div className={`transition-transform group-hover:scale-110 ${currentView === item.id ? 'scale-110' : ''}`}>
                                        {item.icon}
                                    </div>
                                    <span>{item.label}</span>
                                    {currentView === item.id && (
                                        <div className={`ml-auto w-1.5 h-1.5 rounded-full ${consoleMode === 'seller' ? 'bg-indigo-600' : 'bg-blue-600'}`} />
                                    )}
                                </button>
                            )
                        ))}
                    </div>

                    {/* Publish Button (Only Seller) */}
                    {consoleMode === 'seller' && (
                        <div className="px-4 mb-4">
                            <button className="w-full bg-gray-900 hover:bg-black text-white py-3 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-all shadow-lg shadow-gray-200">
                                <PlusCircle size={16} /> 发布智能体
                            </button>
                        </div>
                    )}

                    {/* Bottom: Account Switcher */}
                    <div className="p-4 border-t border-gray-100 relative">
                        <button 
                            onClick={() => setShowAccountMenu(!showAccountMenu)}
                            className="w-full flex items-center gap-3 p-2 rounded-xl hover:bg-gray-50 transition-colors text-left"
                        >
                            <img src={currentAccount.avatar} className="w-9 h-9 rounded-full border border-gray-200" alt="avatar" />
                            <div className="flex-1 min-w-0">
                                <div className="text-sm font-bold text-gray-800 truncate">{currentAccount.name}</div>
                                <div className="text-[10px] text-gray-500 truncate">{currentAccount.title}</div>
                            </div>
                            <MoreVertical size={16} className="text-gray-400" />
                        </button>

                        {/* Popover Menu */}
                        {showAccountMenu && (
                            <div className="absolute bottom-full left-4 right-4 mb-2 bg-white rounded-2xl shadow-xl border border-gray-100 p-2 animate-in slide-in-up zoom-in duration-200 z-50">
                                <div className="text-[10px] font-bold text-gray-400 px-3 py-2 uppercase">切换账号 (Switch Account)</div>
                                {MOCK_ACCOUNTS.map(acc => (
                                    <button 
                                        key={acc.id}
                                        onClick={() => { onSwitchAccount(acc); setShowAccountMenu(false); }}
                                        className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg mb-1 transition-colors ${currentAccount.id === acc.id ? 'bg-gray-50' : 'hover:bg-gray-50'}`}
                                    >
                                        <img src={acc.avatar} className="w-6 h-6 rounded-full" />
                                        <div className="flex-1 text-left">
                                            <div className={`text-xs font-bold ${currentAccount.id === acc.id ? 'text-gray-900' : 'text-gray-600'}`}>{acc.name}</div>
                                            <div className="text-[10px] text-gray-400">{acc.role === 'admin' ? '全权限' : '访客'}</div>
                                        </div>
                                        {currentAccount.id === acc.id && <Check size={14} className="text-blue-600" />}
                                    </button>
                                ))}
                                <div className="h-px bg-gray-100 my-1" />
                                <button className="w-full flex items-center gap-2 px-3 py-2 text-xs font-medium text-gray-600 hover:text-gray-900 rounded-lg hover:bg-gray-50">
                                    <Settings size={14} /> 账号设置
                                </button>
                                <button className="w-full flex items-center gap-2 px-3 py-2 text-xs font-medium text-red-600 hover:bg-red-50 rounded-lg">
                                    <LogOut size={14} /> 退出登录
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // 2. Buyer Dashboard Component (New)
        const BuyerDashboard = ({ account }) => {
            const stats = [
                { label: '本月消费', value: '¥ 299.00', icon: <CreditCard className="text-blue-600" size={20} />, bg: 'bg-blue-50' },
                { label: '生效订阅', value: '3', icon: <Zap className="text-orange-600" size={20} />, bg: 'bg-orange-50' },
                { label: '收藏资产', value: '12', icon: <Heart className="text-pink-600" size={20} />, bg: 'bg-pink-50' },
                { label: '发布需求', value: '1', icon: <Briefcase className="text-green-600" size={20} />, bg: 'bg-green-50' },
            ];

            return (
                <div className="p-8 max-w-6xl mx-auto space-y-8 animate-in fade-in slide-in-up duration-500">
                    <div>
                        <h1 className="text-2xl font-bold text-gray-900">你好, {account.name} 👋</h1>
                        <p className="text-gray-500 mt-1">欢迎回到维观市场用户工作台，这里是您的数字资产中心。</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        {stats.map((s, i) => (
                            <div key={i} className="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm flex items-center gap-4 hover:shadow-md transition-shadow">
                                <div className={`w-12 h-12 rounded-xl flex items-center justify-center ${s.bg}`}>
                                    {s.icon}
                                </div>
                                <div>
                                    <div className="text-xs text-gray-500 font-medium mb-1">{s.label}</div>
                                    <div className="text-xl font-bold text-gray-900">{s.value}</div>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="grid grid-cols-3 gap-8">
                        {/* Subscriptions */}
                        <div className="col-span-2 bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="font-bold text-gray-800 flex items-center gap-2">
                                    <ShoppingBag size={18} className="text-blue-500" /> 最近订阅
                                </h3>
                                <button className="text-xs text-blue-600 hover:underline">查看全部</button>
                            </div>
                            <div className="space-y-4">
                                {[
                                    { title: '数字冷轧质量管理 v2.4', provider: '宝信软件', date: '2026-05-20 到期', status: 'active' },
                                    { title: '全球钢铁价格指数 API', provider: '钢联数据', date: '2026-04-18 到期', status: 'active' },
                                    { title: '设备故障知识图谱', provider: '西门子', date: '已过期', status: 'expired' },
                                ].map((sub, i) => (
                                    <div key={i} className="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-100">
                                        <div className="flex items-center gap-4">
                                            <div className={`w-2 h-2 rounded-full ${sub.status === 'active' ? 'bg-green-500' : 'bg-gray-400'}`}></div>
                                            <div>
                                                <div className="text-sm font-bold text-gray-900">{sub.title}</div>
                                                <div className="text-xs text-gray-500">{sub.provider}</div>
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-xs font-medium text-gray-600">{sub.date}</div>
                                            {sub.status === 'active' && <button className="text-[10px] text-blue-600 font-bold mt-1">管理</button>}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Quick Actions */}
                        <div className="col-span-1 bg-gradient-to-br from-gray-900 to-gray-800 rounded-2xl shadow-lg p-6 text-white flex flex-col justify-between">
                            <div>
                                <h3 className="font-bold text-lg mb-4">快捷操作</h3>
                                <div className="space-y-2">
                                    <button className="w-full bg-white/10 hover:bg-white/20 p-3 rounded-xl flex items-center gap-3 text-sm transition-colors text-left">
                                        <Search size={16} /> 发布采购需求
                                    </button>
                                    <button className="w-full bg-white/10 hover:bg-white/20 p-3 rounded-xl flex items-center gap-3 text-sm transition-colors text-left">
                                        <FileText size={16} /> 申请发票
                                    </button>
                                    <button className="w-full bg-white/10 hover:bg-white/20 p-3 rounded-xl flex items-center gap-3 text-sm transition-colors text-left">
                                        <LifeBuoy size={16} /> 联系客服
                                    </button>
                                </div>
                            </div>
                            <div className="mt-6 pt-6 border-t border-white/10">
                                <div className="text-xs text-gray-400 mb-1">账户余额</div>
                                <div className="text-2xl font-bold">{account.balance}</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 3. Seller Dashboard Component (New)
        const SellerDashboard = ({ account }) => {
            return (
                <div className="p-8 max-w-6xl mx-auto space-y-8 animate-in fade-in slide-in-up duration-500">
                    <div className="flex justify-between items-end">
                        <div>
                            <h1 className="text-2xl font-bold text-gray-900">开发者控制台</h1>
                            <p className="text-gray-500 mt-1">管理您的工业智能体资产与收益数据。</p>
                        </div>
                        <div className="flex gap-3">
                            <span className="text-xs bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full border border-indigo-100 font-medium">
                                <Building2 size={12} className="inline mr-1 mb-0.5"/> 
                                {account.org}
                            </span>
                        </div>
                    </div>

                    {/* Analytics Overview */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm relative overflow-hidden group">
                            <div className="relative z-10">
                                <div className="text-xs text-gray-500 font-bold uppercase tracking-wider mb-2">总收益 (Revenue)</div>
                                <div className="text-3xl font-bold text-gray-900 mb-2">¥ 12,404</div>
                                <div className="text-green-600 text-xs font-bold flex items-center gap-1">
                                    <TrendingUp size={12}/> +12.5% 较上月
                                </div>
                            </div>
                            <div className="absolute right-[-10px] bottom-[-10px] text-gray-50 group-hover:text-indigo-50 transition-colors">
                                <Wallet size={80} />
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                            <div className="text-xs text-gray-500 font-bold uppercase tracking-wider mb-2">活跃订阅 (Active Subs)</div>
                            <div className="text-3xl font-bold text-gray-900 mb-2">856</div>
                            <div className="text-blue-600 text-xs font-bold flex items-center gap-1">
                                <Users size={12}/> +42 新增用户
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                            <div className="text-xs text-gray-500 font-bold uppercase tracking-wider mb-2">API 调用量 (Calls)</div>
                            <div className="text-3xl font-bold text-gray-900 mb-2">1.2M</div>
                            <div className="text-gray-400 text-xs font-bold">
                                99.9% 成功率
                            </div>
                        </div>
                    </div>

                    {/* Agent Management List */}
                    <div className="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                        <div className="px-6 py-4 border-b border-gray-50 flex justify-between items-center">
                            <h3 className="font-bold text-gray-800">已发布资产</h3>
                            <button className="text-indigo-600 text-sm font-bold hover:bg-indigo-50 px-3 py-1.5 rounded-lg transition-colors">
                                + 发布新版本
                            </button>
                        </div>
                        <div className="divide-y divide-gray-50">
                            {[
                                { name: '数字冷轧质量管理', ver: 'v2.4.1', status: 'published', calls: '24k', rating: '4.9' },
                                { name: '高炉热力学对象图谱', ver: 'v1.0.0', status: 'auditing', calls: '-', rating: '-' },
                                { name: '热连轧机组振动预测', ver: 'v0.1.0', status: 'draft', calls: '-', rating: '-' },
                            ].map((agent, i) => (
                                <div key={i} className="p-6 flex items-center justify-between hover:bg-gray-50 transition-colors">
                                    <div className="flex items-center gap-4">
                                        <div className={`w-10 h-10 rounded-lg flex items-center justify-center text-white ${
                                            agent.status === 'published' ? 'bg-indigo-600' : 'bg-gray-400'
                                        }`}>
                                            <Box size={20} />
                                        </div>
                                        <div>
                                            <div className="flex items-center gap-2">
                                                <h4 className="font-bold text-gray-900 text-sm">{agent.name}</h4>
                                                <span className="text-[10px] bg-gray-100 px-1.5 rounded text-gray-500 border border-gray-200">{agent.ver}</span>
                                            </div>
                                            <div className="flex items-center gap-2 mt-1">
                                                <span className={`text-[10px] px-2 py-0.5 rounded-full flex items-center gap-1 ${
                                                    agent.status === 'published' ? 'bg-green-50 text-green-600' : 
                                                    agent.status === 'auditing' ? 'bg-orange-50 text-orange-600' : 'bg-gray-100 text-gray-500'
                                                }`}>
                                                    <div className={`w-1.5 h-1.5 rounded-full ${
                                                        agent.status === 'published' ? 'bg-green-600' : 
                                                        agent.status === 'auditing' ? 'bg-orange-600' : 'bg-gray-500'
                                                    }`}></div>
                                                    {agent.status === 'published' ? '已上架' : agent.status === 'auditing' ? '审核中' : '草稿'}
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-8 text-sm text-gray-500">
                                        <div className="text-center">
                                            <div className="text-gray-900 font-bold">{agent.calls}</div>
                                            <div className="text-[10px]">调用</div>
                                        </div>
                                        <div className="text-center">
                                            <div className="text-gray-900 font-bold">{agent.rating}</div>
                                            <div className="text-[10px]">评分</div>
                                        </div>
                                        <button className="p-2 hover:bg-gray-200 rounded-lg text-gray-400 hover:text-gray-600">
                                            <Settings size={16} />
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // 4. Helper Icons
        const CodeBoxIcon = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="16 18 22 12 16 6"></polyline>
                <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
        );

        // --- MAIN APP COMPONENT ---
        const App = () => {
            // State
            const [currentAccount, setCurrentAccount] = useState(MOCK_ACCOUNTS[0]); // Default to Admin/Dev
            const [consoleMode, setConsoleMode] = useState('seller'); // 'buyer' or 'seller'
            const [currentView, setCurrentView] = useState('seller_dashboard');

            // Effect: Enforce logic when account changes
            useEffect(() => {
                if (currentAccount.role === 'viewer') {
                    setConsoleMode('buyer');
                    setCurrentView('buyer_dashboard');
                } else {
                    // Reset to seller dashboard for dev/admin for better UX
                    setConsoleMode('seller');
                    setCurrentView('seller_dashboard');
                }
            }, [currentAccount]);

            // Handlers
            const handleSwitchAccount = (account) => {
                // Simulate loading/switching
                console.log("Switching to", account.name);
                setCurrentAccount(account);
            };

            const renderContent = () => {
                switch(currentView) {
                    case 'discovery': return <div className="p-8"><h1 className="text-2xl font-bold">市场探索 (Discovery Placeholder)</h1></div>; // Use existing Discovery component here in real app
                    case 'buyer_dashboard': return <BuyerDashboard account={currentAccount} />;
                    case 'seller_dashboard': return <SellerDashboard account={currentAccount} />;
                    case 'settings': return <div className="p-8 text-center text-gray-500">Settings Page Placeholder</div>;
                    default: return <div className="p-8 text-center text-gray-500">View: {currentView} (Construction)</div>;
                }
            };

            return (
                <div className="flex min-h-screen bg-[#f8fafc] font-sans text-gray-600 selection:bg-blue-100 selection:text-blue-900 overflow-hidden">
                    <Sidebar 
                        consoleMode={consoleMode}
                        setConsoleMode={setConsoleMode}
                        currentView={currentView}
                        onChangeView={setCurrentView}
                        currentAccount={currentAccount}
                        onSwitchAccount={handleSwitchAccount}
                    />
                    
                    <main className="flex-1 flex flex-col min-w-0 h-screen overflow-hidden relative bg-[#f8fafc]">
                        <div className="flex-1 overflow-y-auto">
                            {renderContent()}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
